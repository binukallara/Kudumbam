body{

.site-header{text-align:center;padding:48px 20px 24px}

.site-header h1{font-family:'Playfair Display','Noto Sans Malayalam',serif;font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:1px;background:linear-gradient(135deg,#d4af37,#f5e6a8,#d4af37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.breadcrumb{max-width:1200px;margin:0 auto 24px;padding:0 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.crumb{color:#999;text-decoration:none;padding:5px 12px;border-radius:20px;transition:all .2s;background:rgba(255,255,255,.03);border:1px solid transparent;font-size:13px}
.crumb:hover{color:#d4af37;border-color:rgba(212,175,55,.3);background:rgba(212,175,55,.05)}
.crumb.current{color:#d4af37;background:rgba(212,175,55,.1);border-color:rgba(212,175,55,.3)}
.sep{color:#555}
.gen-badge{padding:5px 12px;border-radius:20px;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.08));border:1px solid rgba(212,175,55,.4);color:#d4af37;font-size:11px;font-weight:600;letter-spacing:1px}

main{max-width:1200px;margin:0 auto;padding:0 24px}
.person-section{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:48px}

  position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid rgba(212,175,55,.25);border-radius:20px;
  padding:32px 24px;text-align:center;backdrop-filter:blur(10px);
  transition:all .3s;overflow:hidden;
}
.person-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.6),transparent)}
.person-card:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.5);box-shadow:0 20px 40px -20px rgba(212,175,55,.3)}
.person-card h2{font-family:'Playfair Display','Noto Sans Malayalam',serif;font-size:26px;margin-bottom:6px;color:#fff}
.person-card .relation{color:#d4af37;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;font-weight:600}

.avatar-wrap{position:relative;display:inline-block;margin-bottom:16px}
.avatar-wrap img{display:block;border-radius:50%;object-fit:cover;width:140px;height:140px;border:3px solid rgba(212,175,55,.4);box-shadow:0 0 0 6px rgba(212,175,55,.08),0 10px 30px rgba(0,0,0,.4);background:#12121f}

.contact-list{display:flex;flex-direction:column;gap:8px;margin:20px auto 0;max-width:340px;text-align:left}
.contact-item{display:flex;align-items:center;gap:10px;font-size:13px;color:#b0b0b8;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid rgba(255,255,255,.04);word-break:break-word}
.contact-item svg{color:#d4af37;flex-shrink:0}
.contact-item.empty{color:#555;font-style:italic;justify-content:center}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(145deg,#141422,#0a0a14);border:1px solid rgba(212,175,55,.3);border-radius:20px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;animation:slideUp .3s}

/* ============ STATE & STORAGE ============ */
const STORAGE_KEY = 'familyTree_v1';
let state = { data: loadData(), path: ['root'] };
let editingContext = null;
let pendingPhoto = undefined;

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return JSON.parse(JSON.stringify(defaultData));
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
  catch(e) { alert('സേവ് ചെയ്യാൻ പറ്റിയില്ല. ഫോട്ടോ വലുതായിരിക്കാം.'); }

/* ============ HELPERS ============ */
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getInitials(name) {
  const parts = (name || '?').trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function avatarHTML(person) {
  const size = 140;
  if (person.photo) return `<img src="${person.photo}" alt="${escapeHtml(person.name)}">`;
  const initials = getInitials(person.name);
  const female = person.gender === 'female' || /മകൾ|അമ്മ|ഭാര്യ|സ്ത്രീ/i.test(person.relation||'');
  const color = female ? '#4a2340' : '#1a2540';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="#0a0a14"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="63" font-family="Georgia,serif" font-size="34" fill="#d4af37" text-anchor="middle">${initials}</text></svg>`;
  return `<img src="data:image/svg+xml,${encodeURIComponent(svg)}" alt="${escapeHtml(person.name)}">`;
}
function genId() { return 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function findNode(path) {
  let node = state.data;
  for (let i = 1; i < path.length; i++) {
    if (!node.children) return node;
    const c = node.children.find(x => x.id === path[i]);
    if (!c) return node;
    node = c;
  }
  return node;
}

/* ============ NAVIGATION ============ */
function navigateTo(index) {
  state.path = state.path.slice(0, index + 1);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function navigateToChild(childId) {
  state.path.push(childId);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============ RENDER ============ */
function renderBreadcrumb() {
  const paths = state.path.map((id, i) => {
    let node = state.data;
    for (let j = 1; j <= i; j++) node = node.children?.find(c => c.id === state.path[j]) || node;
    return { name: node.name, index: i };
  });
  const crumbs = paths.map((p, i) => {
    const label = i === 0 ? '🏠 ഹോം' : escapeHtml(p.name);
    if (i === paths.length - 1) return `<span class="crumb current">${label}</span>`;
    return `<a href="#" class="crumb" onclick="navigateTo(${i});return false;">${label}</a>`;
  });
  return `<span class="gen-badge">GEN ${state.path.length}</span><span class="sep">|</span>` + crumbs.join('<span class="sep">›</span>');
}

function renderContacts(p) {
  const items = [];
  if (p.phone) items.push(`<div class="contact-item">${ICONS.phone}<span>${escapeHtml(p.phone)}</span></div>`);
  if (p.email) items.push(`<div class="contact-item">${ICONS.email}<span>${escapeHtml(p.email)}</span></div>`);
  if (p.social?.facebook) items.push(`<div class="contact-item">${ICONS.facebook}<span>${escapeHtml(p.social.facebook)}</span></div>`);
  if (p.social?.instagram) items.push(`<div class="contact-item">${ICONS.instagram}<span>${escapeHtml(p.social.instagram)}</span></div>`);
  if (p.social?.whatsapp) items.push(`<div class="contact-item">${ICONS.whatsapp}<span>${escapeHtml(p.social.whatsapp)}</span></div>`);
  if (p.address) items.push(`<div class="contact-item">${ICONS.location}<span>${escapeHtml(p.address)}</span></div>`);
  if (!items.length) return '<div class="contact-list"><div class="contact-item empty">വിവരങ്ങൾ ലഭ്യമല്ല</div></div>';
  return `<div class="contact-list">${items.join('')}</div>`;
}

function renderPersonCard(person, editTarget) {
  return `
    <div class="person-card">
      <button class="btn btn-edit" onclick="openEditModal('${editTarget}')">✎ Edit</button>
      <div class="avatar-wrap">${avatarHTML(person)}</div>
      <h2>${escapeHtml(person.name)}</h2>
      <div class="relation">${escapeHtml(person.relation || '')}</div>
      ${renderContacts(person)}
    </div>`;
}

function renderChildCard(child) {
  const cnt = child.children?.length || 0;
  return `
    <div class="child-card" onclick="navigateToChild('${child.id}')">
      <div class="avatar-wrap">${avatarHTML(child)}</div>
      <h3>${escapeHtml(child.name)}</h3>
      <div class="relation">${escapeHtml(child.relation || '')}</div>
      ${child.spouse ? `<div class="mini-info">${ICONS.spouse} ${escapeHtml(child.spouse.name)}</div>` : ''}
      ${cnt ? `<div class="family-count">${cnt} മക്കൾ</div>` : `<div class="family-count" style="opacity:.5">മക്കളില്ല</div>`}
    </div>`;
}

function render() {
  const current = findNode(state.path);
  const spouse = current.spouse;
  const spouseDisplay = spouse ? { ...spouse, relation: spouse.relation || (current.gender === 'female' ? 'ഭർത്താവ്' : 'ഭാര്യ') } : null;
  const app = document.getElementById('app');

  app.innerHTML = `
    <header class="site-header">
      <h1>കുടുംബ വൃക്ഷം</h1>
      <div class="subtitle">Family Heritage Tree</div>
    </header>
    <nav class="breadcrumb">${renderBreadcrumb()}</nav>
    <main>
      <section class="person-section">
        ${renderPersonCard(current, 'person')}
        ${spouseDisplay ? renderPersonCard(spouseDisplay, 'spouse') :
          `<div class="person-card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px">
            <div style="color:#888">ഇണയെ ചേർത്തിട്ടില്ല</div>
            <button class="btn btn-primary" onclick="openEditModal('spouse')">+ ഇണയെ ചേർക്കുക</button>
           </div>`}
      </section>
      <section class="children-section">
        <div class="section-header">
          <h2>മക്കൾ <span class="count">${current.children?.length || 0}</span></h2>
          <button class="btn btn-primary" onclick="openEditModal('child-new')">+ പുതിയത് ചേർക്കുക</button>
        </div>
        ${current.children?.length
          ? `<div class="children-grid">${current.children.map(renderChildCard).join('')}</div>`
          : `<div class="empty-state">മക്കളെ ഇതുവരെ ചേർത്തിട്ടില്ല. മുകളിലുള്ള ബട്ടൺ ഉപയോഗിക്കുക.</div>`}
      </section>
    </main>
    <footer class="site-footer">
      <button class="btn" onclick="exportData()">⬇ Export JSON</button>
      <button class="btn" onclick="document.getElementById('importInput').click()">⬆ Import JSON</button>
      <button class="btn" onclick="resetData()">↺ Reset</button>
    </footer>`;
}

/* ============ MODALS ============ */
function openEditModal(target) {
  const current = findNode(state.path);
  let person, title, mode = target;
  if (target === 'person') {
    person = current; title = 'വ്യക്തി വിവരങ്ങൾ';
  } else if (target === 'spouse') {
    person = current.spouse || { name: '', relation: current.gender === 'female' ? 'ഭർത്താവ്' : 'ഭാര്യ', photo: null, phone: '', email: '', social: {}, address: '' };
    title = 'ഇണയുടെ വിവരങ്ങൾ';
  } else if (target === 'child-new') {
    person = { name: '', relation: 'മകൻ', photo: null, phone: '', email: '', social: {}, address: '' };
    title = 'പുതിയ കുടുംബാംഗം';
  }
  editingContext = { target, mode };
  pendingPhoto = undefined;
  renderModal(person, title);
}

function renderModal(person, title) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${title}</h3>
        <div class="photo-upload">
          <img id="photoPreview" src="${person.photo || avatarHTML(person).match(/src="([^"]+)"/)[1]}">
          <div>
            <label class="btn" style="cursor:pointer">
              📷 ഫോട്ടോ മാറ്റുക
              <input type="file" accept="image/*" style="display:none" onchange="handlePhotoChange(event)">
            </label>
            <div style="font-size:11px;color:#666;margin-top:6px">JPG/PNG — ചെറിയ ഫോട്ടോ (500KB-ൽ താഴെ) നല്ലത്</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>പേര് *</label><input id="f_name" value="${escapeHtml(person.name||'')}"></div>
          <div class="form-group"><label>ബന്ധം</label><input id="f_relation" value="${escapeHtml(person.relation||'')}" placeholder="മകൻ / മകൾ / ഭാര്യ"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>ഫോൺ</label><input id="f_phone" value="${escapeHtml(person.phone||'')}"></div>
          <div class="form-group"><label>ഇമെയിൽ</label><input id="f_email" value="${escapeHtml(person.email||'')}"></div>
        </div>
        <div class="form-group"><label>വിലാസം</label><textarea id="f_address" rows="2">${escapeHtml(person.address||'')}</textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Facebook</label><input id="f_fb" value="${escapeHtml(person.social?.facebook||'')}"></div>
          <div class="form-group"><label>Instagram</label><input id="f_ig" value="${escapeHtml(person.social?.instagram||'')}"></div>
        </div>
        <div class="form-group"><label>WhatsApp</label><input id="f_wa" value="${escapeHtml(person.social?.whatsapp||'')}"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">റദ്ദാക്കുക</button>
          <button class="btn btn-primary" onclick="saveModal()">സേവ് ചെയ്യുക</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('f_name')?.focus(), 100);
}

function handlePhotoChange(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    pendingPhoto = ev.target.result;
    document.getElementById('photoPreview').src = pendingPhoto;
  };
  reader.readAsDataURL(file);
}

function saveModal() {
  const current = findNode(state.path);
  const data = {
    name: document.getElementById('f_name').value.trim(),
    relation: document.getElementById('f_relation').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    social: {
      facebook: document.getElementById('f_fb').value.trim(),
      instagram: document.getElementById('f_ig').value.trim(),
      whatsapp: document.getElementById('f_wa').value.trim()
    }
  };
  if (!data.name) { alert('പേര് നിർബന്ധമാണ്'); return; }
  if (pendingPhoto !== undefined) data.photo = pendingPhoto;

  if (editingContext.target === 'person') {
    Object.assign(current, data);
    current.gender = /മകൾ|അമ്മ|ഭാര്യ|സ്ത്രീ/i.test(data.relation) ? 'female' : (current.gender || 'male');
  } else if (editingContext.target === 'spouse') {
    if (!current.spouse) current.spouse = {};
    Object.assign(current.spouse, data);
    current.spouse.gender = 'female';
  } else if (editingContext.target === 'child-new') {
    if (!current.children) current.children = [];
    current.children.push({
      id: genId(), ...data,
      photo: data.photo || null,
      gender: /മകൾ|അമ്മ|ഭാര്യ|സ്ത്രീ/i.test(data.relation) ? 'female' : 'male',
      spouse: null, children: []
    });
  }
  saveData(); closeModal(); render();
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; editingContext = null; pendingPhoto = undefined; }

/* ============ EXPORT / IMPORT / RESET ============ */
function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'family-tree-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed.name) throw new Error('Invalid format');
      state.data = parsed; state.path = ['root'];
      saveData(); render();
      alert('✅ ഇംപോർട്ട് വിജയിച്ചു');
    } catch (err) { alert('❌ ഇംപോർട്ട് പരാജയപ്പെട്ടു: ' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
}
function resetData() {
  if (!confirm('എല്ലാ മാറ്റങ്ങളും നഷ്ടമാകും. തുടരണോ?')) return;
  state.data = JSON.parse(JSON.stringify(defaultData));
  state.path = ['root'];
  saveData(); render();
}

/* ============ INIT ============ */
document.getElementById('importInput').addEventListener('change', importData);
render();
</script>
</body>
</html>
