<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>കുടുംബ വൃക്ഷം</title>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Noto+Serif+Malayalam:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#081d18;--bg2:#17453a;--card:#0f2d26;--line:#2f6050;--gold:#dcb54a;--gold2:#f3dd93;--ivory:#f7f1de;--mute:#a4beb3;--danger:#e8806f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manjari,system-ui,sans-serif;color:var(--ivory);line-height:1.65;min-height:100vh;background:radial-gradient(900px 500px at 50% -80px,var(--bg2),transparent 70%),radial-gradient(circle at 1px 1px,rgba(220,181,74,.1) 1px,transparent 1.6px) 0 0/22px 22px,var(--bg)}
h1,h2,h3{font-family:'Noto Serif Malayalam',serif;margin:0;font-weight:700}
.band{height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,var(--gold2) 14px 18px,var(--bg) 18px 22px)}
.wrap{max-width:1000px;margin:0 auto;padding:26px 16px 60px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;margin-bottom:22px}
header h1{font-size:clamp(2rem,7vw,3.3rem);line-height:1.3;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--mute);letter-spacing:.04em}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.25)}
button{font:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ivory);padding:5px 16px;border-radius:999px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--gold)}
button.on,button.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;font-weight:700}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.crumbs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 6px;margin:0 auto 28px;font-size:.95rem;color:var(--mute)}
.crumbs button{padding:2px 10px;color:var(--mute)}
.crumbs button.cur{color:var(--gold);border-color:var(--gold)}
.crumbs span{opacity:.5}
.couple{display:grid;grid-template-columns:1fr;gap:18px;max-width:440px;margin:0 auto;animation:rise .5s ease both}
.couple.pair{max-width:none;grid-template-columns:1fr auto 1fr;align-items:center}
.orn{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:1.4rem;background:var(--bg);box-shadow:0 0 0 5px rgba(220,181,74,.12)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{position:relative;text-align:center;padding:34px 22px 24px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 45%),var(--card);box-shadow:0 24px 44px -24px #000,inset 0 0 0 6px var(--card),inset 0 0 0 7px rgba(220,181,74,.28)}
.av{object-fit:cover;background:linear-gradient(135deg,#236652,#0d2b23);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Malayalam',serif;color:var(--gold);border:3px solid var(--gold);border-radius:50%;overflow:hidden}
.card .av{width:150px;height:184px;font-size:3.4rem;margin:0 auto 18px;border-radius:999px 999px 18px 18px;box-shadow:0 0 0 6px var(--card),0 0 0 7px rgba(220,181,74,.5),0 20px 30px -14px #000}
.card h2{font-size:1.5rem}
.rel{display:inline-block;margin-top:4px;padding:0 14px;border:1px solid rgba(220,181,74,.5);border-radius:999px;color:var(--gold);font-size:.9rem}
.yrs{color:var(--mute);font-size:.9rem;margin-top:4px}
.info{list-style:none;padding:0;margin:18px 0 0;text-align:left}
.info li{display:flex;gap:10px;padding:8px 2px;border-top:1px solid rgba(47,96,80,.7);font-size:.95rem;word-break:break-word}
.info b{min-width:82px;color:var(--mute);font-weight:400}
.info a{color:var(--gold2);text-decoration-color:rgba(220,181,74,.5)}
.empty{color:var(--mute);font-size:.9rem;margin-top:16px}
.row-add{margin-top:16px}
.row-add button{border-color:var(--gold)}
.sec{margin-top:6px}
.stem{width:2px;height:48px;margin:0 auto 20px;position:relative;background:linear-gradient(var(--line),var(--gold))}
.stem::after{content:"";position:absolute;bottom:-6px;left:50%;width:11px;height:11px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}
.sec h3{font-size:1.35rem;color:var(--gold);text-align:center}
.sec p.hint{margin:2px 0 22px;color:var(--mute);font-size:.9rem;text-align:center}
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.kid{position:relative;width:140px;padding:18px 8px 14px;text-align:center;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:transform .18s,border-color .18s,background .18s}
.kid:hover{transform:translateY(-5px);border-color:var(--gold);background:rgba(220,181,74,.09)}
.kid .av{width:90px;height:90px;margin:0 auto 10px;font-size:2rem;box-shadow:0 0 0 4px var(--bg),0 0 0 5px rgba(220,181,74,.45)}
.kid .n{display:block;font-weight:700;line-height:1.3}
.kid .s{display:inline-block;margin-top:4px;font-size:.78rem;color:var(--mute)}
.kid .pen{position:absolute;top:8px;right:8px;font-size:.75rem;border:1px solid var(--gold);border-radius:999px;padding:0 8px;background:var(--bg);color:var(--gold)}
.add{border-style:dashed}
.add .av{border-style:dashed;color:var(--mute);border-color:var(--line);box-shadow:none}
dialog{background:var(--card);color:var(--ivory);border:1px solid var(--gold);border-radius:18px;padding:22px;width:min(480px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{margin-bottom:12px;color:var(--gold)}
label{display:block;font-size:.85rem;color:var(--mute);margin-top:10px}
input,textarea{width:100%;font:inherit;color:var(--ivory);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.acts button{border-color:var(--line)}
.pv{display:flex;align-items:center;gap:12px}
.pv .av{width:64px;height:64px;font-size:1.4rem;flex:none}
  .banner{margin:0 auto 22px;max-width:640px;text-align:center;font-size:.9rem;color:var(--gold2);border:1px dashed var(--gold);border-radius:12px;padding:8px 14px}
.err{color:var(--danger);font-size:.85rem;min-height:1.3em;margin:6px 0 0}
#pwd input{margin-top:10px}
footer{margin-top:56px;color:var(--mute);font-size:.8rem;text-align:center}
@media(max-width:720px){.couple.pair{grid-template-columns:1fr;max-width:440px}.orn{margin:-6px auto}}
@media(max-width:520px){.two{grid-template-columns:1fr}.kid{width:calc(50% - 9px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <header>
    <div><h1>കുടുംബ വൃക്ഷം</h1><p>തലമുറകളിലൂടെ ഒരു യാത്ര</p></div>
    <div class="tools">
      <button id="bEdit">തിരുത്തുക</button>
      <button id="bExp" hidden>ബാക്കപ്പ് (JSON)</button>
      <button id="bImp" hidden>ഇമ്പോർട്ട്</button>
      <button id="bPw" hidden>അഡ്മിൻ പാസ്‌വേഡ്</button>
      <input type="file" id="fImp" accept="application/json" hidden>
    </div>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="കുടുംബ പാത"></nav>
  <main id="main"></main>
  <footer>മാറ്റങ്ങൾ ക്ലൗഡിൽ സൂക്ഷിക്കും. ആർ തിരുത്തിയാലും എല്ലാവർക്കും തത്സമയം കാണാം.</footer>
</div>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<dialog id="pwd"><form id="pf"><h3 id="pt"></h3><input type="password" id="pi" autocomplete="off" placeholder="പാസ്‌വേഡ്"><input type="password" id="pi2" autocomplete="off" placeholder="വീണ്ടും നൽകുക" hidden><p class="err" id="pe"></p><div class="acts"><button type="button" id="pc">റദ്ദാക്കുക</button><button class="primary">ശരി</button></div></form></dialog>

<script>
const KEY='familyTreeData.v1';
const uid=()=>'p'+Math.random().toString(36).slice(2,9);
const P=(name,rel,extra={})=>({id:uid(),name,rel,born:'',died:'',phone:'',email:'',address:'',facebook:'',instagram:'',whatsapp:'',notes:'',photo:'',spouse:null,children:[],...extra});

/* ---- ഡിഫോൾട്ട് മാതൃകാ ഡാറ്റ: ഇത് നിങ്ങളുടെ കുടുംബത്തിന്റെ പേരുകൾ കൊണ്ട് മാറ്റാം ---- */
function sample(){
  const r=P('മുത്തച്ഛൻ','കുടുംബത്തലവൻ',{born:'1930',spouse:P('മുത്തശ്ശി','ഭാര്യ',{born:'1935'})});
  for(let i=1;i<=8;i++) r.children.push(P('മകൻ/മകൾ '+i,i+'-ാമത്തെ സന്താനം'));
  const c=r.children[0];
  c.spouse=P('പങ്കാളി','ഭാര്യ');
  c.children.push(P('കൊച്ചുമകൻ 1','കൊച്ചുമകൻ'),P('കൊച്ചുമകൾ 2','കൊച്ചുമകൾ'));
  c.children[0].spouse=P('പങ്കാളി','ഭാര്യ');
  c.children[0].children.push(P('ചെറുമകൻ','അടുത്ത തലമുറ'));
  return r;
}

let root,path=[],edit=false,auth=null,ce=false;
const genLabel=n=>n<1?'മക്കൾ':n<2?'കൊച്ചുമക്കൾ':(n+2)+'-ാം തലമുറ';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{};

const SB_URL='https://bqlngeljjqumeyfwenzn.supabase.co',SB_KEY='sb_publishable_Mbq8gZDjtQ01qJ-AaHQgLw_CeyvR_Km';
const HD={apikey:SB_KEY,'Content-Type':'application/json'};
let PW='',PWSET=new Set(),ver=null,tick=0;
async function rpc(fn,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:HD,body:JSON.stringify(args||{})});const t=await r.text();
  if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(m)}return t?JSON.parse(t):null}
async function fetchRows(){const r=await fetch(`${SB_URL}/rest/v1/people?select=id,parent_id,sort,data&order=sort`,{headers:HD});if(!r.ok)throw new Error(await r.text());return r.json()}
function build(rows){const m={};rows.forEach(r=>m[r.id]={...r.data,id:r.id,children:[]});
  rows.slice().sort((a,b)=>a.sort-b.sort).forEach(r=>{if(r.parent_id&&m[r.parent_id])m[r.parent_id].children.push(m[r.id])});return m.root||null}
const errMsg=e=>{const m=e.message||String(e);return m.includes('not allowed')?'ഈ മാറ്റം വരുത്താൻ അനുമതിയില്ല':m.includes('wrong password')?'പാസ്‌വേഡ് തെറ്റാണ്':m.includes('already used')?'ഈ പാസ്‌വേഡ് മറ്റൊരാൾക്ക് നൽകിയിട്ടുണ്ട്':m}
async function load(){
  try{root=build(await fetchRows());if(!root)throw new Error('ഡാറ്റ ഒന്നും ഇല്ല');ver=await rpc('tree_version').catch(()=>null);return true}
  catch(e){$('#main').innerHTML='<p class="banner">ഡാറ്റ ലഭിച്ചില്ല. Supabase-ൽ supabase-setup.sql Run ചെയ്തിട്ടുണ്ടോ എന്ന് പരിശോധിക്കുക.<br><small>'+esc(e.message)+'</small></p>';return false}}
async function refresh(){const r=build(await fetchRows());if(r)root=r;ver=await rpc('tree_version').catch(()=>null);render(true)}
async function poll(){if(document.hidden||$('#dlg').open||$('#pwd').open)return;
  try{const v=await rpc('tree_version');if(v!==ver)await refresh()}catch(e){if(++tick%5===0)try{await refresh()}catch(x){}}}
async function persist(o,parent){const {id,children,...data}=o;
  const k=parent?parent.children.indexOf(o):0,i=k>=0?k:parent.children.length;
  await rpc('save_person',{p_pw:PW,p_id:id,p_parent:parent?parent.id:null,p_data:data,p_sort:i})}
const all=(n=root,o=[])=>{o.push(n);n.children.forEach(c=>all(c,o));return o};
const can=ns=>edit&&auth&&(auth.lvl==='admin'||ns.some(n=>n.id===auth.id));
function askPw(title,confirm){return new Promise(res=>{
  const d=$('#pwd'),i=$('#pi'),i2=$('#pi2'),e=$('#pe');
  $('#pt').textContent=title;i.value=i2.value='';i2.hidden=!confirm;e.textContent='';
  const done=v=>{d.close();res(v)};
  $('#pc').onclick=()=>done(null);
  d.oncancel=()=>res(null);
  $('#pf').onsubmit=ev=>{ev.preventDefault();const v=i.value;
    if(confirm){if(v.length<4)return e.textContent='കുറഞ്ഞത് 4 അക്ഷരം വേണം';if(v!==i2.value)return e.textContent='രണ്ടും ഒരുപോലെയല്ല'}
    if(v)done(v)};
  d.showModal();i.focus()})}
async function login(){
  const pw=await askPw('തിരുത്താനുള്ള പാസ്‌വേഡ് നൽകുക');if(!pw)return false;
  let w;try{w=await rpc('whoami',{p_pw:pw})}catch(e){alert('സെർവറുമായി ബന്ധപ്പെടാൻ കഴിഞ്ഞില്ല: '+e.message);return false}
  if(!w){alert('പാസ്‌വേഡ് തെറ്റാണ്');return false}
  PW=pw;auth=w==='admin'?{lvl:'admin'}:{lvl:'user',id:w};
  if(w==='admin'){try{PWSET=new Set(await rpc('pw_set_ids'))}catch(e){}}else path=[...(nodes_to(w)||[])];
  return true}
function nodes_to(id,n=root,p=[]){if(n.id===id)return p;for(const c of n.children){const r=nodes_to(id,c,[...p,c.id]);if(r)return r}return null}
function nodes(){const out=[root];let n=root;for(const id of path){n=n.children.find(c=>c.id===id);if(!n)break;out.push(n)}return out}
function count(n){return n.children.reduce((a,c)=>a+1+count(c),0)}
const go=p=>{path=p;location.hash=p.join('/')};
addEventListener('hashchange',()=>{path=location.hash.slice(1).split('/').filter(Boolean);render()});

function avatar(p,cls=''){
  const ini=esc((p.name||'?').trim().charAt(0));
  return p.photo?`<img class="av ${cls}" src="${esc(p.photo)}" alt="${esc(p.name)}">`:`<div class="av ${cls}" aria-hidden="true">${ini}</div>`;
}
function link(type,v){
  if(!v)return'';
  const t=v.trim();
  if(type==='ph')return`<a href="tel:${esc(t.replace(/\s/g,''))}">${esc(t)}</a>`;
  if(type==='em')return`<a href="mailto:${esc(t)}">${esc(t)}</a>`;
  const base={fb:'https://facebook.com/',ig:'https://instagram.com/',wa:'https://wa.me/'}[type];
  const h=/^https?:/i.test(t)?t:base+(type==='wa'?t.replace(/\D/g,''):t.replace(/^@/,''));
  return`<a href="${esc(h)}" target="_blank" rel="noopener">${esc(t)}</a>`;
}
function card(p,isSpouse){
  const rows=[['ഫോൺ',link('ph',p.phone)],['ഇമെയിൽ',link('em',p.email)],['വിലാസം',esc(p.address)],['വാട്സാപ്പ്',link('wa',p.whatsapp)],['ഫേസ്ബുക്ക്',link('fb',p.facebook)],['ഇൻസ്റ്റഗ്രാം',link('ig',p.instagram)],['കുറിപ്പ്',esc(p.notes)]].filter(r=>r[1]);
  const yrs=[p.born,p.died].filter(Boolean).join(' – ');
  return`<article class="card">${avatar(p)}<h2>${esc(p.name)}</h2><div class="rel">${esc(p.rel)}</div>${yrs?`<div class="yrs">${esc(yrs)}</div>`:''}
  ${rows.length?`<ul class="info">${rows.map(r=>`<li><b>${r[0]}</b><span>${r[1]}</span></li>`).join('')}</ul>`:`<div class="empty">വിവരങ്ങൾ ചേർത്തിട്ടില്ല</div>`}
  ${ce?`<div class="row-add"><button data-edit="${isSpouse?'sp':'me'}">വിവരങ്ങൾ ചേർക്കുക / മാറ്റുക</button></div>`:''}</article>`;
}

function render(keep){
  const ns=nodes();path=ns.slice(1).map(n=>n.id);
  const cur=ns[ns.length-1];ce=can(ns);
  $('#crumbs').innerHTML=ns.map((n,i)=>`${i?'<span>›</span>':''}<button class="${i===ns.length-1?'cur':''}" data-go="${i}">${esc(n.name)}</button>`).join('');
  const pair=cur.spouse||ce;
  let h=`<section class="couple${pair?' pair':''}">${card(cur,false)}${pair?'<div class="orn">❦</div>':''}${cur.spouse?card(cur.spouse,true):(ce?`<article class="card"><div class="empty">ജീവിതപങ്കാളി ഇല്ല</div><div class="row-add"><button data-edit="addsp">പങ്കാളിയെ ചേർക്കുക</button></div></article>`:'')}</section>`;
  h+=`<section class="sec"><div class="stem"></div><h3>${cur.children.length?`${genLabel(path.length)} (${cur.children.length})`:genLabel(path.length)}</h3>`;
  h+=cur.children.length?`<p class="hint">ഒരാളെ തൊട്ടാൽ അവരുടെ കുടുംബം കാണാം</p>`:`<p class="hint">${ce?'താഴെയുള്ള + അമർത്തി കുട്ടികളെ ചേർക്കാം':'ഇവിടെ കൂടുതൽ അംഗങ്ങളെ ചേർത്തിട്ടില്ല'}</p>`;
  h+=`<div class="kids">${cur.children.map(c=>`<button class="kid" data-kid="${c.id}">${ce?`<span class="pen" data-pen="${c.id}">തിരുത്തുക</span>`:''}${avatar(c)}<span class="n">${esc(c.name)}</span><span class="s">${count(c)?count(c)+' പിൻഗാമികൾ':(c.spouse?'കുടുംബം':'')}</span></button>`).join('')}
  ${ce?`<button class="kid add" data-addkid><div class="av">+</div><span class="n">കുട്ടിയെ ചേർക്കുക</span></button>`:''}</div></section>`;
  $('#main').innerHTML=(edit?(!ce?'<p class="banner">ഈ പേജ് തിരുത്താൻ നിങ്ങളുടെ പാസ്‌വേഡിന് അനുമതിയില്ല. അനുവദിച്ച അംഗത്തിന്റെ പേജിലേക്ക് പോകുക.</p>':'<p class="banner">തിരുത്തൽ മോഡ്: ഈ പേജിൽ പങ്കാളിയെയും കുട്ടികളെയും ചേർക്കാം. ചേർത്ത കുട്ടിയെ തൊട്ട് അടുത്ത തലമുറയും ചേർക്കാം.</p>'):'')+h;
  $('#bEdit').classList.toggle('on',edit);$('#bEdit').textContent=edit?'പൂട്ടുക':'തിരുത്തുക';
  ['#bExp','#bImp','#bPw'].forEach(s=>$(s).hidden=!(edit&&auth&&auth.lvl==='admin'));
  if(!keep)scrollTo({top:0});
}

/* ---- നാവിഗേഷൻ ---- */
$('#crumbs').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(nodes().slice(1,+b.dataset.go+1).map(n=>n.id))};
$('#main').onclick=e=>{
  const ns=nodes(),cur=ns[ns.length-1],par=ns[ns.length-2]||null;
  const pen=e.target.closest('[data-pen]');
  if(pen){e.stopPropagation();const c=cur.children.find(x=>x.id===pen.dataset.pen);return openForm(c,{owner:c,parent:cur,node:true})}
  const k=e.target.closest('[data-kid]');if(k)return go([...path,k.dataset.kid]);
  if(e.target.closest('[data-addkid]')){const c=P('പുതിയ അംഗം',genLabel(path.length));return openForm(c,{owner:c,parent:cur,node:true,isNew:true})}
  const ed=e.target.closest('[data-edit]');if(!ed)return;
  const t=ed.dataset.edit;
  if(t==='me')openForm(cur,{owner:cur,parent:par,node:true,noDelete:true});
  if(t==='sp')openForm(cur.spouse,{owner:cur,parent:par,remove:()=>{cur.spouse=null}});
  if(t==='addsp'){const sp=P('പങ്കാളി','ഭാര്യ/ഭർത്താവ്');openForm(sp,{owner:cur,parent:par,isNew:true,attach:()=>{cur.spouse=sp}})}
};

/* ---- എഡിറ്റ് ഫോം ---- */
const F=[['name','പേര്'],['rel','ബന്ധം'],['born','ജനനവർഷം'],['died','മരണവർഷം'],['phone','ഫോൺ നമ്പർ'],['email','ഇമെയിൽ'],['whatsapp','വാട്സാപ്പ് നമ്പർ'],['facebook','ഫേസ്ബുക്ക് (ലിങ്ക്/ഐഡി)'],['instagram','ഇൻസ്റ്റഗ്രാം (ലിങ്ക്/ഐഡി)']];
function openForm(p,ctx){
  if(!p)return;
  const pwf=auth&&auth.lvl==='admin'&&ctx.node,has=PWSET.has(p.id);
  const canDel=!ctx.isNew&&((ctx.node&&!ctx.noDelete)||ctx.remove);
  const f=k=>`<label>${F.find(x=>x[0]===k)[1]}<input name="${k}" value="${esc(p[k])}"></label>`;
  $('#frm').innerHTML=`<h3>വിവരങ്ങൾ</h3>
  <div class="pv">${avatar(p)}<div style="flex:1"><label style="margin:0">ഫോട്ടോ (ഫയൽ)<input type="file" id="ph" accept="image/*"></label></div></div>
  <label>ഫോട്ടോ ലിങ്ക് (ഓപ്ഷണൽ)<input name="photo" value="${esc(p.photo&&p.photo.startsWith('data:')?'':p.photo)}"></label>
  ${f('name')}${f('rel')}<div class="two">${f('born')}${f('died')}</div>
  <div class="two">${f('phone')}${f('whatsapp')}</div>${f('email')}
  <label>വിലാസം<textarea name="address" rows="2">${esc(p.address)}</textarea></label>
  <div class="two">${f('facebook')}${f('instagram')}</div>
  <label>കുറിപ്പ്<textarea name="notes" rows="2">${esc(p.notes)}</textarea></label>
  ${pwf?`<label>ഈ അംഗത്തിനുള്ള എഡിറ്റ് പാസ്‌വേഡ് ${has?'(സെറ്റ് ആണ്; മാറ്റാൻ പുതിയത് നൽകുക)':'(ഇവരുടെ കുടുംബം തിരുത്താൻ)'}<input name="newpw" autocomplete="off"></label>${has?'<label><input type="checkbox" name="clearpw" style="width:auto"> പാസ്‌വേഡ് നീക്കം ചെയ്യുക</label>':''}`:''}
  <div class="acts">${canDel?'<button type="button" class="danger" id="dDel">ഇല്ലാതാക്കുക</button>':''}<button type="button" id="dCan">റദ്ദാക്കുക</button><button type="button" class="primary" id="dOk">സേവ് ചെയ്യുക</button></div>`;
  let photo=p.photo;
  $('#ph').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;photo=await shrink(fl);$('.pv').firstElementChild.outerHTML=avatar({...p,photo})};
  $('#dCan').onclick=()=>$('#dlg').close();
  $('#dOk').onclick=async()=>{
    const fd=new FormData($('#frm'));
    const np=(fd.get('newpw')||'').trim();
    if(np&&np.length<4)return alert('പാസ്‌വേഡ് കുറഞ്ഞത് 4 അക്ഷരം വേണം');
    for(const [k,v] of fd.entries()) if(!['photo','newpw','clearpw'].includes(k))p[k]=v.trim();
    const url=(fd.get('photo')||'').trim();
    p.photo=url||(photo&&photo.startsWith('data:')?photo:'');
    $('#dOk').disabled=true;
    try{
      if(ctx.attach)ctx.attach();
      await persist(ctx.owner,ctx.parent);
      if(pwf&&np)await rpc('set_person_pw',{p_pw:PW,p_person:p.id,p_new:np});
      else if(pwf&&fd.get('clearpw'))await rpc('set_person_pw',{p_pw:PW,p_person:p.id,p_new:''});
      if(pwf)PWSET=new Set(await rpc('pw_set_ids'));
      $('#dlg').close();await refresh();
    }catch(e){alert(errMsg(e))}
    $('#dOk').disabled=false;
  };
  if(canDel)$('#dDel').onclick=async()=>{
    if(!confirm('"'+p.name+'"'+(ctx.node?' എന്നയാളെ (പിൻഗാമികളോടൊപ്പം) ഇല്ലാതാക്കട്ടെ?':' എന്ന പങ്കാളിയെ നീക്കട്ടെ?')))return;
    try{if(ctx.node)await rpc('delete_person',{p_pw:PW,p_id:p.id});else{ctx.remove();await persist(ctx.owner,ctx.parent)}
      $('#dlg').close();await refresh()}catch(e){alert(errMsg(e))}};
  $('#dlg').showModal();
}
function shrink(file){return new Promise(res=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const s=Math.min(im.width,im.height),S=300,c=document.createElement('canvas');c.width=c.height=S;
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};
  im.src=u})}

/* ---- ടൂൾബാർ ---- */
$('#frm').onsubmit=e=>{e.preventDefault();const b=$('#dOk');if(b)b.click()};
$('#bEdit').onclick=async()=>{if(edit){edit=false;auth=null;PW='';return render(true)}if(await login()){edit=true;go(path);render()}};
$('#bPw').onclick=async()=>{const a=await askPw('പുതിയ അഡ്മിൻ പാസ്‌വേഡ്',true);if(!a)return;try{await rpc('set_admin_pw',{p_pw:PW,p_new:a});PW=a;alert('അഡ്മിൻ പാസ്‌വേഡ് മാറ്റി')}catch(e){alert(errMsg(e))}};
$('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(root,null,1)],{type:'application/json'}));a.download='family-backup.json';a.click()};
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const t=JSON.parse(await f.text());
    if(!confirm('ഈ ഫയലിലെ എല്ലാ അംഗങ്ങളെയും ക്ലൗഡിലേക്ക് ചേർക്കട്ടെ? (ഒരേ ഐഡി ഉള്ളവ മാറ്റിയെഴുതും)'))return;
    t.id='root';
    const up=async(x,par,i)=>{const {children=[],pw,auth:_a,...data}=x;await rpc('save_person',{p_pw:PW,p_id:x.id,p_parent:par,p_data:data,p_sort:i});for(let j=0;j<children.length;j++)await up(children[j],x.id,j)};
    await up(t,null,0);await refresh();alert('ഇമ്പോർട്ട് പൂർത്തിയായി')}
  catch(x){alert('ഇമ്പോർട്ട് പരാജയപ്പെട്ടു: '+errMsg(x))}};
load().then(ok=>{if(!ok)return;path=location.hash.slice(1).split('/').filter(Boolean);render();setInterval(poll,6000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})});
</script>
</body>
</html>
